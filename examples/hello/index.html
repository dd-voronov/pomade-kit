<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello</title>
    <style>
      body { font: 13px/1.4 -apple-system, system-ui, sans-serif; margin: 16px; color: #222; }
      table { border-collapse: collapse; }
      th, td { text-align: left; padding: 2px 12px 2px 0; }
      .error { color: #b00; }
      body.overlay { margin: 12px; }
      body.overlay input { box-sizing: border-box; width: 100%; font: inherit; padding: 6px 8px; }
      .skill-notice { display: flex; gap: 12px; align-items: center; margin: 0 0 12px; padding: 8px 10px;
        border: 1px solid #c9dde6; border-radius: 6px; background: #eef6fa; }
      .skill-notice p { margin: 0; flex: 1; }
      .about { margin: 8px 0 12px; padding: 8px 10px; border: 1px solid #e2e8ec; border-radius: 6px; background: #fafbfc; }
      .about h2 { margin: 0 0 6px; font-size: 13px; }
      .about ul { margin: 0; padding-left: 18px; }
      code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="skill-notice" data-testid="skill-notice" hidden>
      <p data-testid="skill-notice-text"></p>
      <button type="button" data-testid="skill-notice-dismiss">Got it</button>
    </div>
    <h1 data-testid="title">Hello</h1>
    <button type="button" data-testid="about-toggle">About</button>
    <section class="about" data-testid="about" hidden>
      <h2>About Hello</h2>
      <p data-testid="about-version"></p>
      <p>Skills this app ships for agents — copy or link a folder into an agent's skills folder:</p>
      <ul data-testid="about-skills"></ul>
    </section>
    <p data-testid="state">Connecting…</p>
    <p data-testid="group"></p>
    <p data-testid="agents"></p>
    <p data-testid="git"></p>
    <p>
      <button type="button" data-testid="use-done">Toggle done/ folder</button>
      <button type="button" data-testid="pick-folder">Choose folder…</button>
      <button type="button" data-testid="only-claude">Only claude</button>
    </p>
    <p data-testid="folder"></p>
    <p data-testid="launches"></p>
    <p data-testid="route"></p>
    <button type="button" data-testid="open-tab" hidden>Open the roadmap in a tab</button>
    <p data-testid="events"></p>
    <p><button type="button" data-testid="greet" disabled>Greet</button> <span data-testid="listeners"></span></p>
    <p><button type="button" data-testid="notify">Notify me</button></p>
    <p><button type="button" data-testid="open-ticker">Open the ticker</button></p>
    <p><button type="button" data-testid="open-overlay">Quick note…</button></p>
    <p>
      <button type="button" data-testid="scratch-new">New scratch file</button>
      <button type="button" data-testid="scratch-delete">Trash scratch files</button>
      <span data-testid="scratch-status"></span>
    </p>
    <table data-testid="rows"></table>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
